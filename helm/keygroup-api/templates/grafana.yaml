# Grafana with the Prometheus datasource and the SLO dashboard (files/slo-dashboard.json)
# provisioned on start. Anonymous admin access: local use only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: keygroup
        folder: Keygroup
        type: file
        options:
          path: /var/lib/grafana/dashboards
  slo.json: |
    {{- .Files.Get "files/slo-dashboard.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        checksum/dashboard: {{ .Files.Get "files/slo-dashboard.json" | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/slo.json }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          volumeMounts:
            - { name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: config, mountPath: /var/lib/grafana/dashboards/slo.json, subPath: slo.json }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi } # startup indexing spikes past 512Mi
      volumes:
        - name: config
          configMap:
            name: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
