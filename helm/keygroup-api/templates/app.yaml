apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-service
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Picked up by Prometheus pod discovery (templates/prometheus.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: file-service
      # Lets the app reach the emulator as http://floci-gcp:4588
      hostAliases:
        - ip: {{ required "flociIP is required" .Values.flociIP | quote }}
          hostnames: [floci-gcp]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: floci
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: GCS_BUCKET
              value: {{ required "gcsBucket is required" .Values.gcsBucket | quote }}
            - name: STORAGE_EMULATOR_HOST
              value: http://floci-gcp:4588
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: http
