# Only image.tag, gcsBucket, gcpServiceAccount and flociIP change per deploy;
# the Makefile sets them (make deploy).

image:
  repository: keygroup-api
  tag: local # image is imported straight into k3s, never pulled

replicas: 2

gcsBucket: ""         # terraform output customer_files_bucket
gcpServiceAccount: "" # terraform output file_service_sa_email (Workload Identity)
flociIP: ""           # floci-gcp container IP; pods can't resolve docker DNS names

# Third-party images, pinned to exact versions
images:
  nginx: nginx:1.31.6-alpine
  prometheus: prom/prometheus:v3.14.0
  grafana: grafana/grafana:13.0.9
